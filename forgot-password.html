<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quên mật khẩu - CraveCraft</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-body">
    <main class="auth-layout single">
      <section class="auth-card" aria-label="Quên mật khẩu">
        <a class="brand" href="login.html">
          <span class="brand-mark">C</span>
          <span>
            <strong>CraveCraft</strong>
            <small>Món Việt đúng lúc, đúng gu</small>
          </span>
        </a>
        <p class="eyebrow">Khôi phục tài khoản</p>
        <h1>Quên mật khẩu?</h1>
        <p>Nhập email để nhận hướng dẫn đặt lại mật khẩu khi backend email được kết nối.</p>
        <form data-forgot-form>
          <label>Email <input name="email" type="email" autocomplete="email" required /></label>
          <p class="auth-message" data-auth-message></p>
          <button class="primary-action full" type="submit">Gửi hướng dẫn</button>
          <a class="ghost-action full" href="login.html">Quay lại đăng nhập</a>
        </form>
      </section>
    </main>
    <script src="auth.js"></script>
  </body>
</html>
